; ESP32-S3-WROOM-1 N16R8: 16 MB Flash and 8 MB OPI PSRAM.
[platformio]
; USB is the default upload environment; OTA uses esp32s3_ota.
default_envs = esp32s3
; ASCII-only build path for Windows linker compatibility.
build_dir = ../.pio-build/onboard-led-blink

[env:esp32s3]
platform = espressif32 @ 8.0.0
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 460800

board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi

build_flags =
    -DBOARD_HAS_PSRAM
    -I lib/ESP32-S3-TinyML_inferencing/src/edge-impulse-sdk/porting/espressif/esp-dsp/modules/fft/include
    -I lib/ESP32-S3-TinyML_inferencing/src/edge-impulse-sdk/porting/espressif/esp-dsp/modules/common/include
    -DEIDSP_USE_ESP_DSP=0
lib_deps =
    knolleary/PubSubClient@^2.8

[env:esp32s3_ota]
extends = env:esp32s3
upload_protocol = espota
; OTA target IP is supplied at runtime via --upload-port.
